<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Usando IA: da concepção à entrega</title>
    <meta
      name="description"
      content="Materiais, entregáveis e referências do treinamento de três dias sobre desenvolvimento de aplicações com agentes de código."
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css"
    />
    <style>
      :root {
        --theme-color: #6a1bff;
        --sidebar-width: 19rem;
      }
      .app-name-link img {
        max-width: 60%;
      }
      .sidebar {
        padding-top: 1.5rem;
      }
      .sidebar ul li p {
        margin: 1.1rem 0 0.4rem;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: #8c8c96;
      }
      .markdown-section {
        max-width: 56rem;
      }
      .markdown-section table {
        display: table;
        width: 100%;
      }
      .markdown-section blockquote {
        border-left-color: var(--theme-color);
        background: #f7f4ff;
        padding: 0.6rem 1rem;
        border-radius: 0 4px 4px 0;
      }
      .markdown-section code {
        color: #4b1ab8;
        background: #f3eeff;
      }
      /* Faixa de downloads da página inicial */
      .downloads {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
        gap: 0.9rem;
        margin: 1.5rem 0;
      }
      .downloads a {
        display: block;
        padding: 1rem 1.1rem;
        border: 1px solid #e5e5ea;
        border-radius: 8px;
        text-decoration: none;
        background: #fff;
      }
      .downloads a:hover {
        border-color: var(--theme-color);
      }
      .downloads strong {
        display: block;
        color: #18181e;
      }
      .downloads span {
        font-size: 0.85rem;
        color: #666670;
      }
      /* ------------------------------------------------------------------
         Tema escuro.

         O tema vue do docsify pinta o texto dos títulos em `.anchor span`
         (#34495e) e os links com a --theme-color (#6a1bff). Sobre fundo
         escuro isso dá 1,9:1 e 2,7:1 — abaixo do mínimo de 4,5:1 do WCAG.
         Regras em `h1..h4` não resolvem: o texto está dentro do `.anchor
         span`, que tem cor própria. Daí os seletores abaixo.

         Todos os pares desta paleta foram verificados entre 5,9:1 e 16:1.
         ------------------------------------------------------------------ */
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17171c;
          --bg-elev: #1e1e25;
          --bg-code: #22222c;
          --fg: #d6d6e0;
          --fg-strong: #f2f2f7;
          --fg-muted: #a6a6b4;
          --border: #30303c;
          --link: #b79cff;
          --link-hover: #d0bcff;
        }

        body,
        .sidebar,
        body.close .sidebar-toggle,
        .sidebar-toggle {
          background-color: var(--bg);
          color: var(--fg);
        }
        .sidebar {
          background-color: var(--bg-elev);
          border-right-color: var(--border);
          color: var(--fg);
        }

        /* Corpo do texto e negrito */
        .markdown-section,
        .markdown-section p,
        .markdown-section li,
        .markdown-section strong,
        .markdown-section h1,
        .markdown-section h2,
        .markdown-section h3,
        .markdown-section h4,
        .markdown-section h5,
        .markdown-section h6 {
          color: var(--fg);
        }

        /* Títulos: a cor real vive aqui, não no h1..h6 */
        .markdown-section h1 .anchor span,
        .markdown-section h2 .anchor span,
        .markdown-section h3 .anchor span,
        .markdown-section h4 .anchor span,
        .markdown-section h5 .anchor span,
        .markdown-section h6 .anchor span,
        .anchor span {
          color: var(--fg-strong);
        }
        .markdown-section strong {
          color: var(--fg-strong);
        }

        /* Links do conteúdo */
        .markdown-section a,
        .markdown-section a code {
          color: var(--link);
        }
        .markdown-section a:hover {
          color: var(--link-hover);
        }

        /* Menu lateral */
        .sidebar ul li a {
          color: #b8b8c4;
        }
        .sidebar ul li a:hover,
        .sidebar ul li.active > a {
          color: var(--link);
        }
        .sidebar ul li p {
          color: #9a9aa8;
        }
        .sidebar > h1 a,
        .app-name-link {
          color: var(--fg-strong);
        }
        .sidebar-toggle span {
          background-color: var(--link);
        }

        /* Código */
        .markdown-section code,
        .markdown-section pre,
        .markdown-section pre > code {
          background-color: var(--bg-code);
        }
        .markdown-section code {
          color: #ffb07c;
        }
        .markdown-section pre > code {
          color: var(--fg);
        }
        .markdown-section pre::after,
        .markdown-section output::after {
          color: var(--fg-muted);
        }

        /* Realce de sintaxe: os tons claros do tema não sobrevivem ao fundo escuro */
        .token.comment,
        .token.prolog,
        .token.doctype,
        .token.cdata {
          color: #8a8a99;
        }
        .token.string,
        .token.attr-value,
        .token.control,
        .token.directive,
        .token.unit {
          color: #9ee6b8;
        }
        .token.attr-name,
        .token.atrule,
        .token.regex,
        .token.statement,
        .language-css .token.string,
        .style .token.string,
        .token.entity,
        .token.url {
          color: #7fc4ff;
        }
        .token.keyword,
        .token.selector,
        .token.important,
        .token.tag {
          color: #cbb6ff;
        }
        .token.number,
        .token.boolean,
        .token.function {
          color: #ffb07c;
        }
        .token.operator,
        .token.punctuation {
          color: #a6a6b4;
        }

        /* Tabelas */
        .markdown-section tr {
          background-color: var(--bg-elev);
          border-top-color: var(--border);
        }
        .markdown-section tr:nth-child(2n) {
          background-color: #232330;
        }
        .markdown-section td,
        .markdown-section th {
          border-color: var(--border);
        }
        .markdown-section th {
          color: var(--fg-strong);
        }

        /* Citações e avisos */
        .markdown-section blockquote {
          background: #241c3a;
          border-left-color: var(--link);
          color: #c3bcd8;
        }
        .markdown-section blockquote strong {
          color: #ece7f8;
        }
        .markdown-section p.tip {
          background-color: #2a1f24;
          color: var(--fg);
        }
        .markdown-section p.tip code {
          background-color: #3a2c31;
        }
        .markdown-section p.tip em {
          color: var(--fg-muted);
        }
        .markdown-section hr {
          border-bottom-color: var(--border);
        }

        /* Busca */
        .search input {
          background-color: var(--bg-code);
          border-color: var(--border);
          color: var(--fg);
        }
        .search input::placeholder {
          color: var(--fg-muted);
        }
        .search {
          border-bottom-color: var(--border);
        }
        .search .results-panel,
        .search h2,
        .search p {
          color: var(--fg);
        }
        .search .matching-post {
          border-bottom-color: var(--border);
        }
        .search p.empty {
          color: var(--fg-muted);
        }
        .search .search-keyword {
          color: #ffb07c;
        }
        .search a:hover {
          color: var(--link);
        }

        /* Paginação */
        .pagination-item-label,
        .pagination-item-subtitle {
          color: var(--fg-muted);
        }
        .pagination-item-title {
          color: var(--link);
        }
        .docsify-pagination-container {
          border-top-color: var(--border);
        }

        /* Botão de copiar código */
        .docsify-copy-code-button {
          background: var(--border) !important;
          color: var(--fg) !important;
        }

        /* Cartões de download */
        .downloads a {
          background: var(--bg-elev);
          border-color: var(--border);
        }
        .downloads a:hover {
          border-color: var(--link);
        }
        .downloads strong {
          color: var(--fg-strong);
        }
        .downloads span {
          color: var(--fg-muted);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">Carregando…</div>
    <script>
      window.$docsify = {
        name: 'Usando IA',
        nameLink: '#/',
        repo: 'https://github.com/gaabrielrd/treinamento-ia',
        loadSidebar: true,
        // Sem estes alias, uma página profunda procura _sidebar.md na própria
        // pasta, não encontra, e fica sem menu.
        alias: {
          '/.*/_sidebar.md': '/_sidebar.md',
          '/.*/_404.md': '/_404.md',
        },
        loadNavbar: false,
        subMaxLevel: 2,
        maxLevel: 3,
        auto2top: true,
        relativePath: true,
        notFoundPage: '_404.md',
        search: {
          placeholder: 'Buscar nos materiais…',
          noData: 'Nenhum resultado.',
          depth: 3,
          paths: 'auto',
        },
        copyCode: {
          buttonText: 'Copiar',
          errorText: 'Erro',
          successText: 'Copiado',
        },
        pagination: {
          previousText: 'Anterior',
          nextText: 'Próximo',
          crossChapter: true,
          crossChapterText: true,
        },
        // Arquivos que não são páginas do site: abrem/baixam direto.
        externalLinkTarget: '_blank',
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-jsx.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-tsx.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-markdown.min.js"></script>
  </body>
</html>
